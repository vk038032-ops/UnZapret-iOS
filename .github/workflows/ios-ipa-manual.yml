name: Build signed iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check required secrets
        env:
          IOS_SIGNING_CERT_BASE64: ${{ secrets.IOS_SIGNING_CERT_BASE64 }}
          IOS_SIGNING_CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
          IOS_TRUST_CERT_BASE64: ${{ secrets.IOS_TRUST_CERT_BASE64 }}
          IOS_APP_PROVISIONING_PROFILE: ${{ secrets.IOS_APP_PROVISIONING_PROFILE }}
          IOS_NE_PROVISIONING_PROFILE: ${{ secrets.IOS_NE_PROVISIONING_PROFILE }}
        run: |
          missing=0

          for var in \
            IOS_SIGNING_CERT_BASE64 \
            IOS_SIGNING_CERT_PASSWORD \
            IOS_TRUST_CERT_BASE64 \
            IOS_APP_PROVISIONING_PROFILE \
            IOS_NE_PROVISIONING_PROFILE
          do
            if [ -z "${!var}" ]; then
              echo "::error::$var is not configured"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install signing certificate
        env:
          IOS_SIGNING_CERT_BASE64: ${{ secrets.IOS_SIGNING_CERT_BASE64 }}
          IOS_SIGNING_CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/signing.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$IOS_SIGNING_CERT_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$IOS_SIGNING_CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Install provisioning profiles
        env:
          IOS_APP_PROVISIONING_PROFILE: ${{ secrets.IOS_APP_PROVISIONING_PROFILE }}
          IOS_NE_PROVISIONING_PROFILE: ${{ secrets.IOS_NE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$IOS_APP_PROVISIONING_PROFILE" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision"

          echo "$IOS_NE_PROVISIONING_PROFILE" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/network-extension.mobileprovision"

      - name: Build iOS
        env:
          IOS_TRUST_CERT_BASE64: ${{ secrets.IOS_TRUST_CERT_BASE64 }}
          PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
          PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
          FALLBACK_S3_ENDPOINT: ${{ secrets.FALLBACK_S3_ENDPOINT }}
          DEV_AGW_PUBLIC_KEY: ${{ secrets.DEV_AGW_PUBLIC_KEY }}
          DEV_AGW_ENDPOINT: ${{ secrets.DEV_AGW_ENDPOINT }}
          DEV_S3_ENDPOINT: ${{ secrets.DEV_S3_ENDPOINT }}
          FREE_V2_ENDPOINT: ${{ secrets.FREE_V2_ENDPOINT }}
          PREM_V1_ENDPOINT: ${{ secrets.PREM_V1_ENDPOINT }}
        run: |
          chmod +x deploy/build_ios.sh
          ./deploy/build_ios.sh

      - name: Find IPA
        run: |
          echo "Searching for generated IPA..."
          find . -type f -name "*.ipa" -print

          IPA="$(find . -type f -name "*.ipa" | head -1)"

          if [ -z "$IPA" ]; then
            echo "::error::IPA file was not generated"
            exit 1
          fi

          cp "$IPA" "$RUNNER_TEMP/DefaultVPN-split-exclusions.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DefaultVPN-iOS-split-exclusions
          path: ${{ runner.temp }}/DefaultVPN-split-exclusions.ipa
